<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件：在 AI 网站内唤起</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,'Noto Sans SC',system-ui,sans-serif;color:#18181B;background:#FFFFFF}
a{color:#3B5BDB}a:hover{color:#2F4AB8}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #FFFFFF; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: #F1F1EF; border-bottom: 1px solid #E7E7E4; font-size: 12px; color: #52525B">
    <span style="padding: 2px 8px; border-radius: 6px; background: #FFFFFF; border: 1px solid #DCDCD8">示意</span>
    任意 AI 对话网站（ChatGPT、Claude、Gemini、豆包、Kimi、DeepSeek 等），插件注入到输入框
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 24px; gap: 20px">
    <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px; color: #A1A1AA">
      <div style="align-self: flex-end; max-width: 70%; padding: 12px 16px; border-radius: 16px; background: #F4F4F5; color: #71717A">帮我看看这段代码有没有问题……</div>
      <div style="max-width: 80%; line-height: 1.7; color: #8B8B94">（此前的对话内容）</div>
    </div>

    <div style="margin-top: auto; width: 100%; max-width: 760px; position: relative; display: flex; flex-direction: column; gap: 8px">
      <div role="listbox" aria-label="Promptory 提示词" style="border: 1px solid #DCDCD8; border-radius: 14px; background: #FFFFFF; box-shadow: 0 12px 40px rgba(0,0,0,0.14); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #EFEFEC; font-size: 12px; color: #63636B">
          <div style="width: 18px; height: 18px; border-radius: 5px; background: #18181B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">P</div>
          <span style="font-weight: 600; color: #18181B">Promptory</span>
          <span>匹配「zb」· 按使用频率排序</span>
          <a href="Main.dc.html" style="margin-left: auto; font-size: 12px">打开提示词库</a>
        </div>
        <div style="display: flex; flex-wrap: wrap">
          <div style="flex: 1 1 240px; min-width: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #EFEFEC">
            <div role="option" aria-selected="true" style="padding: 10px 12px; border-radius: 10px; background: #EEF1FC">
              <div style="font-weight: 600">周报生成器 <span style="font-size: 12px; color: #2F4AB8; font-weight: 500">/zb</span></div>
              <div style="font-size: 12px; color: #52525B">写作助手 · ★ v4 · 3 个变量</div>
            </div>
            <div role="option" aria-selected="false" style="padding: 10px 12px; border-radius: 10px">
              <div style="font-weight: 600">月度总结</div>
              <div style="font-size: 12px; color: #52525B">写作助手 · 2 个变量</div>
            </div>
            <div role="option" aria-selected="false" style="padding: 10px 12px; border-radius: 10px">
              <div style="font-weight: 600">会议纪要整理</div>
              <div style="font-size: 12px; color: #52525B">写作助手 · 1 个变量</div>
            </div>
          </div>
          <form style="flex: 1.4 1 320px; min-width: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="font-size: 12px; color: #63636B; font-weight: 600">填写变量（Tab 切换）</div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap">
              <label style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #3F3F46">姓名
                <input value="小王" style="height: 36px; padding: 0 10px; border: 2px solid #3B5BDB; border-radius: 8px; font-size: 13px"></label>
              <label style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #3F3F46">风格
                <select style="height: 36px; padding: 0 8px; border: 1px solid #DCDCD8; border-radius: 8px; font-size: 13px; background: #FFFFFF"><option>简洁</option><option>正式</option><option>活泼</option></select></label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #3F3F46">工作要点
              <textarea rows="3" style="padding: 8px 10px; border: 1px solid #DCDCD8; border-radius: 8px; font-size: 13px; resize: none">- 完成支付模块重构
- 修复 12 个线上问题</textarea></label>
          </form>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 14px; border-top: 1px solid #EFEFEC; background: #FAFAF9; font-size: 12px; color: #63636B">
          <span>↑↓ 选择</span><span>Tab 填写下一项</span><span>↵ 插入输入框</span><span>⌘↵ 插入并发送</span><span>Esc 关闭</span>
        </div>
      </div>

      <label style="display: flex; align-items: flex-end; gap: 10px; padding: 12px 12px 12px 18px; border: 1px solid #C9C9C4; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.05)">
        <input aria-label="消息输入框" value="/zb" style="flex: 1; border: none; outline: none; font-size: 16px; min-width: 0; height: 32px">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #D4D4D8; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"></path></svg>
        </span>
      </label>
      <div style="font-size: 12px; color: #63636B; text-align: center">输入 / 唤起，继续输入快捷词或关键词筛选；不打断原网站的使用</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
