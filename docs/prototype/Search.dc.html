<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>快速搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,'Noto Sans SC',system-ui,sans-serif;color:#18181B;background:#55555C}
a{color:#3B5BDB}a:hover{color:#2F4AB8}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 120px 16px 48px; background: #55555C; display: flex; justify-content: center; align-items: flex-start; font-size: 14px">
  <div role="dialog" aria-label="快速搜索" style="width: 100%; max-width: 680px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,0.3); overflow: hidden">
    <label style="display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #E7E7E4; color: #63636B">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
      <input aria-label="搜索提示词或命令" value="周报" style="flex: 1; border: none; outline: none; font-size: 18px; color: #18181B; min-width: 0">
      <span style="font-size: 12px; padding: 2px 6px; border: 1px solid #DCDCD8; border-radius: 5px">Esc</span>
    </label>

    <div style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="padding: 8px 12px 4px; font-size: 12px; font-weight: 600; color: #63636B">提示词</div>
      <a href="Use.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #EEF1FC; text-decoration: none; color: #18181B">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600"><mark style="background: #FEF3C7; color: #854D0E; padding: 0 2px; border-radius: 3px">周报</mark>生成器</span>
          <span style="font-size: 12px; color: #52525B">写作助手 · 3 个变量 · 最近使用 2 小时前</span>
        </div>
        <span style="font-size: 12px; color: #2F4AB8">↵ 填写并使用</span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; text-decoration: none; color: #18181B">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600">月度总结（基于<mark style="background: #FEF3C7; color: #854D0E; padding: 0 2px; border-radius: 3px">周报</mark>汇总）</span>
          <span style="font-size: 12px; color: #52525B">写作助手 · 2 个变量</span>
        </div>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; text-decoration: none; color: #18181B">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600">会议纪要整理</span>
          <span style="font-size: 12px; color: #52525B">内容匹配：「…输出可直接粘贴进<mark style="background: #FEF3C7; color: #854D0E; padding: 0 2px; border-radius: 3px">周报</mark>的待办…」</span>
        </div>
      </a>

      <div style="padding: 12px 12px 4px; font-size: 12px; font-weight: 600; color: #63636B">操作</div>
      <button style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; font-size: 14px; text-align: left; cursor: pointer">新建提示词<span style="margin-left: auto; font-size: 12px; color: #63636B">⌘N</span></button>
      <button style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; font-size: 14px; text-align: left; cursor: pointer">从剪贴板快速保存<span style="margin-left: auto; font-size: 12px; color: #63636B">⌘⇧V</span></button>
      <button style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; font-size: 14px; text-align: left; cursor: pointer">导入 JSON / Markdown</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 20px; border-top: 1px solid #E7E7E4; background: #FAFAF9; font-size: 12px; color: #63636B">
      <span>↑↓ 选择</span><span>↵ 填写变量并使用</span><span>⌘C 直接复制原文</span><span>⌘E 编辑</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
